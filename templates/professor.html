<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel do Professor - Quiz Tabuada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f7f9fb; }
        .bg-gradient-primary { background-image: linear-gradient(to right, #4f46e5, #7c3aed); }
    </style>
</head>
<body class="p-8">
    <div class="max-w-6xl mx-auto bg-white p-8 rounded-2xl shadow-lg border border-gray-100">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-extrabold text-gray-800">Painel do Professor</h1>
            <a href="/logout" class="text-red-500 font-semibold hover:text-red-700">Sair do Sistema</a>
        </div>

        <div class="bg-indigo-600 p-6 rounded-xl text-white mb-8 shadow-md">
            <h2 class="text-xl font-bold mb-2">Análise de Performance Adaptativa</h2>
            <p class="opacity-90">O sistema está monitorando os erros dos alunos para ajustar as próximas tabuadas.</p>
        </div>

        <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase">Aluno</th>
                        <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase">Score</th>
                        <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase">Status</th>
                        <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase">Dificuldade</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    <tr>
                        <td class="px-6 py-4 font-medium text-gray-900">Ana Costa</td>
                        <td class="px-6 py-4">85%</td>
                        <td class="px-6 py-4"><span class="bg-green-100 text-green-800 px-3 py-1 rounded-full text-xs font-bold">Dominou</span></td>
                        <td class="px-6 py-4 text-gray-500 font-sm">Nenhuma</td>
                    </tr>
                    <tr>
                        <td class="px-6 py-4 font-medium text-gray-900">Beto Silva</td>
                        <td class="px-6 py-4">42%</td>
                        <td class="px-6 py-4"><span class="bg-red-100 text-red-800 px-3 py-1 rounded-full text-xs font-bold">Reforço</span></td>
                        <td class="px-6 py-4 text-gray-500 font-sm">Tabuadas do 7 e 8</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
