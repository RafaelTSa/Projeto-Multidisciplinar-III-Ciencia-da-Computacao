<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Quiz Tabuada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f0f4f8; }
        .bg-gradient-app { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <main class="w-full max-w-md bg-white p-10 rounded-3xl shadow-xl">
        <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">Entrar no Quiz</h1>
        
        <form action="/login" method="POST">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Usuário</label>
                <input type="text" name="usuario" required class="w-full p-4 border rounded-xl focus:ring-2 ring-indigo-500 outline-none">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-2">Senha</label>
                <input type="password" name="senha" required class="w-full p-4 border rounded-xl focus:ring-2 ring-indigo-500 outline-none">
            </div>
            
            <button type="submit" class="w-full bg-gradient-app text-white py-4 rounded-xl font-bold hover:opacity-90 transition-all shadow-lg">
                Entrar
            </button>
        </form>
        <p class="mt-6 text-center text-sm text-gray-400 font-medium italic">Rafael - Projeto Multidisciplinar III</p>
    </main>
</body>
</html>
