<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Quiz Tabuada - Reforço Adaptativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Animação para o feedback aparecer suavemente */
        .fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, -20px); } to { opacity: 1; transform: translate(-50%, 0); } }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- Feedback Reforçado (Cores mais intensas e área maior) -->
    {% if feedback %}
    <div class="fixed top-8 left-1/2 -translate-x-1/2 px-10 py-5 rounded-2xl text-white font-black text-2xl {{ feedback.cor }} shadow-2xl z-50 fade-in border-4 border-white/20">
        {{ feedback.texto }}
    </div>
    {% endif %}

    <div class="bg-white p-10 rounded-[3rem] shadow-2xl w-full max-w-md text-center border-b-8 border-slate-200">
        <div class="flex justify-between text-xs font-black text-slate-400 mb-8 uppercase tracking-widest">
            <span class="bg-slate-100 px-3 py-1 rounded-full">PERGUNTA {{ progresso }} / 10</span>
            <a href="/" class="text-red-400 hover:text-red-600 transition-colors">Sair</a>
        </div>

        <h2 class="text-indigo-600 font-black text-xl mb-2 italic tracking-tighter uppercase">Quanto é o resultado?</h2>
        <div class="text-8xl font-black text-slate-800 mb-10 tracking-tighter drop-shadow-sm">
            {{ n1 }}<span class="text-indigo-400 mx-2">×</span>{{ n2 }}
        </div>

        <form action="/aluno" method="POST" class="space-y-6">
            <input type="hidden" name="n1" value="{{ n1 }}">
            <input type="hidden" name="n2" value="{{ n2 }}">
            
            <!-- Input maior e mais legível -->
            <input type="number" name="resposta" autofocus required placeholder="?"
                class="w-full p-6 text-6xl text-center border-4 rounded-[2rem] outline-none focus:border-indigo-500 border-slate-100 bg-slate-50 text-slate-700 transition-all placeholder:opacity-20">
            
            <!-- Botão Ajustado (Meta 3): Maior, mais vibrante e com área de toque ampliada -->
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-black py-6 rounded-[2rem] text-2xl shadow-xl shadow-indigo-200 transition-all flex items-center justify-center gap-3">
                PRÓXIMA QUESTÃO
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                </svg>
            </button>
        </form>
        
        <p class="mt-8 text-slate-400 text-sm font-medium italic">Foco adaptativo: Tabuada do {{ n1 }}</p>
    </div>

    <!-- Script para remover o feedback após 3 segundos automaticamente -->
    <script>
        setTimeout(() => {
            const fb = document.querySelector('.fade-in');
            if(fb) fb.style.display = 'none';
        }, 3000);
    </script>
</body>
</html>
