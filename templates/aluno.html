<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Tabuada Divertida - Aluno</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="font-family: Arial; text-align: center; background-color: #e0f7fa;">

    <h1>Área do Aluno 🧠</h1>
    
    {% if msg %}
        <div style="padding: 15px; font-weight: bold; font-size: 1.2em;">
            {{ msg }}
        </div>
    {% endif %}

    <div style="background: white; width: 300px; margin: 0 auto; padding: 20px; border-radius: 15px; border: 3px solid #00acc1;">
        <h2>Quanto é:</h2>
        <p style="font-size: 3em; color: #007c91;">{{ n1 }} x {{ n2 }}</p>

        <form method="POST">
            <input type="hidden" name="n1" value="{{ n1 }}">
            <input type="hidden" name="n2" value="{{ n2 }}">
            
            <input type="number" name="resposta" placeholder="?" required
                   style="font-size: 2em; width: 80px; text-align: center;">
            <br><br>
            <button type="submit" style="background: #00acc1; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">
                Responder!
            </button>
        </form>
    </div>

    <br>
    <a href="/">Voltar para Início</a>
</body>
</html>
